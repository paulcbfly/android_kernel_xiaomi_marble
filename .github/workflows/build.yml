name: Build ReSukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git curl bc bison flex \
            libssl-dev make clang lld llvm \
            zip unzip p7zip-full python3

      - name: Setup ReSukiSU
        run: |
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/dev/kernel/setup.sh | bash -

          echo "===== Check ReSukiSU ====="
          find . -type d | grep -i "kernelsu" || true
          grep -R "CONFIG_KSU\|CONFIG_KPM\|SUSFS" arch/arm64/configs/ || true

          echo "===== ReSukiSU VERSION ====="
          if [ -d KernelSU ]; then
            cd KernelSU
            git rev-parse HEAD || true
            git log -1 --oneline || true
            cd ..
          fi

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export O=out

          echo "===== MEMORY ====="
          free -h

          echo "===== DEFCONFIG ====="
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          echo "===== DISABLE LTO ====="
          scripts/config \
            --file out/.config \
            -d LTO \
            -d LTO_CLANG \
            -d THINLTO \
            -d LTO_CLANG_THIN

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "===== BUILD IMAGE ====="
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j1 \
            Image

      - name: Find Image
        run: |
          echo "===== SEARCH IMAGE ====="
          find out -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.lz4" \)

      - name: Pack Image.7z
        run: |
          IMG=$(find out -type f -name Image | head -n 1)

          echo "IMAGE=$IMG"

          test -n "$IMG"

          mkdir -p output
          cp "$IMG" output/Image

          cd output
          7z a -t7z Image.7z Image

      - name: Upload Image.7z
        uses: actions/upload-artifact@v4
        with:
          name: Image.7z
          path: output/Image.7z
